website:
  title: "Backgammon Simplified"
  site-url: "https://backgammonsimplified.github.io"

bs-publication:
  schema-id: "https://backgammonsimplified.github.io/schemas/publication-identity-v1"
  name: "Backgammon Simplified"
  acronym: "BS"
  canonical-origin: "https://backgammonsimplified.github.io"
  indexing:
    environment-variable: "BS_PUBLICATION_MODE"
    default-mode: development
    modes:
      development:
        robots-meta: "noindex, follow"
        robots-txt:
          - "User-agent: *"
          - "Allow: /"
      production:
        robots-meta: "index, follow"
        robots-txt:
          - "User-agent: *"
          - "Allow: /"
          - "Sitemap: https://backgammonsimplified.github.io/sitemap.xml"
  pages:
    default:
      type: page
      status: draft
    types:
      page:
        schema-type: WebPage
        updates-feed: false
      learn-index:
        schema-type: CollectionPage
        updates-feed: false
      learn-lesson:
        schema-type: Article
        updates-feed: true
      research-index:
        schema-type: CollectionPage
        updates-feed: false
      research-article:
        schema-type: Article
        updates-feed: true
      engine-benchmark-index:
        schema-type: CollectionPage
        updates-feed: false
      benchmark-report:
        schema-type: Report
        updates-feed: true
    statuses:
      published:
        indexable: true
        sitemap: true
        rss: true
      preliminary:
        indexable: false
        sitemap: false
        rss: false
      draft:
        indexable: false
        sitemap: false
        rss: false
      fixture:
        indexable: false
        sitemap: false
        rss: false
      error:
        indexable: false
        sitemap: false
        rss: false
      legacy:
        indexable: false
        sitemap: false
        rss: false
    routes:
      /:
        source: site/index.qmd
        type: page
        status: published
      /about.html:
        source: site/about.qmd
        type: page
        status: published
      /analyze/index.html:
        source: site/analyze/index.qmd
        type: page
        status: published
      /glossary/:
        source: site/glossary/index.qmd
        type: page
        status: published
      /licensing.html:
        source: site/licensing.qmd
        type: page
        status: published
      /match-predictor/index.html:
        source: site/match-predictor/index.qmd
        type: page
        status: published
      /updates/index.html:
        source: site/updates/index.qmd
        type: page
        status: published
      /learn/index.html:
        source: site/learn/index.qmd
        type: learn-index
        status: published
        parents:
          - label: Home
            route: /
      /learn/cube/why-is-25-percent-the-take-point.html:
        source: site/learn/cube/why-is-25-percent-the-take-point.qmd
        type: learn-lesson
        status: draft
        parents:
          - label: Home
            route: /
          - label: Learn
            route: /learn/index.html
        related:
          - /learn/index.html
      /research/index.html:
        source: site/research/index.qmd
        type: research-index
        status: published
        parents:
          - label: Home
            route: /
      /engine-benchmark/index.html:
        source: site/engine-benchmark/index.qmd
        type: engine-benchmark-index
        status: published
        parents:
          - label: Home
            route: /
        related:
          - /engine-benchmark/sage-vs-gnu-stage1/index.html
      /engine-benchmark/sage-vs-gnu-stage1/index.html:
        source: site/engine-benchmark/sage-vs-gnu-stage1/index.qmd
        type: benchmark-report
        status: preliminary
        parents:
          - label: Home
            route: /
          - label: Engine Benchmark
            route: /engine-benchmark/index.html
        related:
          - /research/sage-vs-gnu-additional-details.html
      /research/sage-vs-gnu-additional-details.html:
        source: site/research/sage-vs-gnu-additional-details.qmd
        type: research-article
        status: preliminary
        parents:
          - label: Home
            route: /
          - label: Research
            route: /research/index.html
        related:
          - /engine-benchmark/sage-vs-gnu-stage1/index.html
      /posts/2026-07-cube-basics/index.html:
        source: site/posts/2026-07-cube-basics/index.qmd
        type: page
        status: fixture
      /posts/2026-07-opening-play-article.html:
        source: site/posts/2026-07-opening-play-article.qmd
        type: page
        status: fixture
      /posts/2026-07-research-methodology.html:
        source: site/posts/2026-07-research-methodology.qmd
        type: page
        status: fixture
      /posts/2026-07-sage-vs-gnu-update.html:
        source: site/posts/2026-07-sage-vs-gnu-update.qmd
        type: page
        status: fixture
      /posts/2026-07-site-update.html:
        source: site/posts/2026-07-site-update.qmd
        type: page
        status: fixture
  research:
    categories:
      - Learn
      - Position Analyzer
      - Match Predictor
      - Engine Benchmark
      - Research
